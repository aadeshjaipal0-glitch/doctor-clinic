<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediCare Plus — Doctor & Dental Clinic</title>

<!-- Enhanced SEO Meta Tags -->
<meta name="description" content="Welcome to MediCare Plus. Book appointments online with certified doctors and dental specialists. Trusted healthcare, 24/7 emergency contact, and professional diagnostic care.">
<meta name="keywords" content="doctor clinic, dental clinic, book appointment, healthcare center, emergency medical care">

<link href="https://googleapis.com" rel="stylesheet">
<style>
:root {
  --navy:    #0B1F3A;
  --blue:    #1565C0;
  --sky:     #2196F3;
  --teal:    #00897B;
  --teal2:   #00BFA5;
  --white:   #FFFFFF;
  --off:     #F4F8FF;
  --cream:   #EEF4FF;
  --gray:    #607D8B;
  --lgray:   #ECEFF1;
  --border:  rgba(21,101,192,0.1);
  --gold:    #FFB300;
  --red:     #E53935;
  --shadow:  0 4px 24px rgba(11,31,58,0.08);
  --shadow2: 0 16px 48px rgba(11,31,58,0.14);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Outfit',sans-serif;background:var(--white);color:var(--navy);overflow-x:hidden;}

/* SCROLL PROGRESS */
#progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--sky));z-index:9999;width:0%;transition:width 0.1s;}

/* LOADER */
#loader{position:fixed;inset:0;background:var(--navy);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity 0.8s ease,transform 0.8s cubic-bezier(0.76,0,0.24,1);}
#loader.hide{opacity:0;transform:translateY(-30px);pointer-events:none;}
.loader-cross{font-size:48px;animation:pulse 1.2s ease-in-out infinite;}
.loader-name{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:white;letter-spacing:2px;opacity:0;animation:fadeIn 0.6s 0.3s ease forwards;}
.loader-bar{width:180px;height:2px;background:rgba(255,255,255,0.15);border-radius:2px;overflow:hidden;opacity:0;animation:fadeIn 0.6s 0.5s ease forwards;}
.loader-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal2),var(--sky));animation:loadFill 1.4s 0.6s ease forwards;width:0%;}

@keyframes loadFill{to{width:100%;}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
@keyframes fadeIn{to{opacity:1;}}

/* NAVBAR */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 5%;height:72px;display:flex;align-items:center;justify-content:space-between;transition:all 0.4s cubic-bezier(0.16,1,0.3,1);background:rgba(255,255,255,0.97);backdrop-filter:blur(20px);box-shadow:0 1px 0 var(--border),0 4px 24px rgba(11,31,58,0.06);}
.nav-brand{display:flex;align-items:center;gap:12px;}
.nav-icon{width:42px;height:42px;background:linear-gradient(135deg,var(--teal),var(--sky));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 12px rgba(0,137,123,0.3);}
.nav-name{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:var(--navy);letter-spacing:0.5px;}
.nav-name span{color:var(--teal);}
.nav-links{display:flex;gap:32px;list-style:none;}
.nav-links a{color:var(--gray);text-decoration:none;font-size:14px;font-weight:500;position:relative;transition:color 0.3s;letter-spacing:0.3px;}
.nav-links a::after{content:'';position:absolute;bottom:-3px;left:0;width:0;height:1.5px;background:var(--teal);transition:width 0.3s cubic-bezier(0.16,1,0.3,1);}
.nav-links a:hover{color:var(--navy);}
.nav-links a:hover::after{width:100%;}
.nav-cta{background:linear-gradient(135deg,var(--teal),var(--sky));color:white;padding:10px 24px;border-radius:30px;font-size:14px;font-weight:600;text-decoration:none;transition:all 0.3s;box-shadow:0 4px 16px rgba(0,137,123,0.25);letter-spacing:0.3px;}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,137,123,0.35);}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;}
.hamburger span{width:24px;height:2px;background:var(--navy);border-radius:2px;transition:all 0.3s;}

/* MOBILE MENU */
.mobile-menu{position:fixed;inset:0;background:var(--navy);z-index:998;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;transform:translateX(100%);transition:transform 0.5s cubic-bezier(0.16,1,0.3,1);}
.mobile-menu.open{transform:translateX(0);}
.mobile-menu a{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;color:white;text-decoration:none;transition:color 0.3s;}
.mobile-menu a:hover{color:var(--teal2);}

/* HERO SECTION UPGRADED */
.hero{min-height:100vh;background:linear-gradient(135deg,var(--navy) 0%,#0D2B4E 50%,#0F3460 100%);display:grid;grid-template-columns:1.2fr 0.8fr;align-items:center;padding:120px 5% 60px;position:relative;overflow:hidden;gap:40px;}
.hero::before{content:'';position:absolute;top:-100px;right:-100px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,191,165,0.08) 0%,transparent 70%);}
.hero::after{content:'';position:absolute;bottom:-150px;left:-100px;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(33,150,243,0.06) 0%,transparent 70%);}
.hero-grid-pattern{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;}
.hero-content{position:relative;z-index:2;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(0,191,165,0.12);border:1px solid rgba(0,191,165,0.25);color:var(--teal2);font-size:12px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;padding:7px 16px;border-radius:30px;margin-bottom:28px;animation:slideDown 0.9s 0.4s cubic-bezier(0.16,1,0.3,1) both;}
.badge-dot{width:6px;height:6px;background:var(--teal2);border-radius:50%;animation:badgePulse 2s infinite;}

@keyframes badgePulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
@keyframes slideDown{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:translateY(0);}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}

.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(40px,5.5vw,68px);font-weight:700;color:white;line-height:1.08;margin-bottom:22px;}
.hero h1 .line1{display:block;animation:slideUp 0.9s 0.6s cubic-bezier(0.16,1,0.3,1) both;}
.hero h1 .line2{display:block;background:linear-gradient(135deg,var(--teal2),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;animation:slideUp 0.9s 0.75s cubic-bezier(0.16,1,0.3,1) both;}
.hero-sub{font-size:16px;color:rgba(255,255,255,0.6);line-height:1.8;max-width:480px;font-weight:300;margin-bottom:36px;animation:slideUp 0.9s 0.9s cubic-bezier(0.16,1,0.3,1) both;}

/* HERO CTAs */
.hero-btns{display:flex;gap:16px;flex-wrap:wrap;animation:slideUp 0.9s 1.1s cubic-bezier(0.16,1,0.3,1) both;margin-bottom:24px;}
.btn-teal{background:linear-gradient(135deg,var(--teal),var(--teal2));color:white;padding:14px 32px;border-radius:30px;font-size:15px;font-weight:600;text-decoration:none;transition:all 0.3s;box-shadow:0 6px 24px rgba(0,137,123,0.35);display:inline-flex;align-items:center;gap:8px;}
.btn-teal:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,137,123,0.45);}
.btn-emergency{background:var(--red);color:white;padding:14px 32px;border-radius:30px;font-size:15px;font-weight:600;text-decoration:none;transition:all 0.3s;box-shadow:0 6px 24px rgba(229,57,53,0.35);display:inline-flex;align-items:center;gap:8px;}
.btn-emergency:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(229,57,53,0.45);background:#d32f2f;}

/* HERO IMAGE CONTAINER */
.hero-image-container{position:relative;display:flex;justify-content:center;align-items:center;z-index:2;}
.doctor-fallback-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.1);padding:40px;border-radius:24px;backdrop-filter:blur(10px);text-align:center;width:100%;max-width:400px;box-shadow:var(--shadow2);}
.fallback-avatar{font-size:64px;margin-bottom:16px;animation:pulse 2s infinite;}
.fallback-certifications{display:flex;justify-content:center;gap:12px;margin-top:20px;font-size:12px;color:rgba(255,255,255,0.5);}
.fallback-certifications span{background:rgba(255,255,255,0.05);padding:6px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);}

.hero-stats{display:flex;gap:0;margin-top:52px;padding-top:40px;border-top:1px solid rgba(255,255,255,0.08);animation:slideUp 0.9s 1.3s cubic-bezier(0.16,1,0.3,1) both;}
.hstat{padding-right:36px;margin-right:36px;border-right:1px solid rgba(255,255,255,0.08);}
.hstat:last-child{border:none;padding:0;margin:0;}
.hstat-num{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;background:linear-gradient(135deg,var(--teal2),#80DEEA);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;}
.hstat-label{font-size:11px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1.5px;margin-top:4px;}

/* SERVICES SECTION UPGRADED */
.services-section{padding:100px 5%;background:var(--off);text-align:center;}
.section-header{max-width:600px;margin:0 auto 60px;}
.section-header h2{font-family:'Cormorant Garamond',serif;font-size:42px;color:var(--navy);margin-bottom:16px;}
.section-header p{color:var(--gray);font-size:16px;line-height:1.6;}
.services-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:30px;max-width:1200px;margin:0 auto;}

.service-card {
  background: var(--white);
  border-radius: 20px;
  padding: 40px 30px;
  text-align: left;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  position: relative;
  overflow: hidden;
}
