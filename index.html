<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediCare Plus — Premium Doctor & Dental Clinic</title>

<!-- Technical SEO Upgrades -->
<meta name="description" content="Welcome to MediCare Plus. Book online appointments with our certified medical specialists and dental experts. Trusted family healthcare with 24/7 emergency support.">
<meta name="keywords" content="medical clinic, dental clinic, healthcare center, book doctor appointment, emergency medical services">
<link rel="canonical" href="https://medicareplus.com">

<!-- Google Fonts -->
<link href="https://googleapis.com" rel="stylesheet">

<style>
:root {
  --navy:    #0B1F3A;
  --blue:    #1565C0;
  --sky:     #2196F3;
  --teal:    #00897B;
  --teal2:   #00BFA5;
  --white:   #FFFFFF;
  --off:     #F4F8FF;
  --cream:   #EEF4FF;
  --gray:    #607D8B;
  --lgray:   #ECEFF1;
  --border:  rgba(21,101,192,0.1);
  --gold:    #FFB300;
  --red:     #D32F2F;
  --shadow:  0 4px 24px rgba(11,31,58,0.06);
  --shadow2: 0 16px 48px rgba(11,31,58,0.12);
}

*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Outfit',sans-serif;background:var(--white);color:var(--navy);overflow-x:hidden;line-height:1.6;}

/* SCROLL PROGRESS BAR */
#progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--sky));z-index:9999;width:0%;transition:width 0.1s;}

/* PRELOADER */
#loader{position:fixed;inset:0;background:var(--navy);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity 0.6s ease,transform 0.6s ease;}
#loader.hide{opacity:0;transform:translateY(-30px);pointer-events:none;}
.loader-logo-svg{width:60px;height:60px;fill:var(--teal2);animation:pulse 1.5s ease-in-out infinite;}
.loader-name{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:white;letter-spacing:2px;}
.loader-bar{width:180px;height:2px;background:rgba(255,255,255,0.15);border-radius:2px;overflow:hidden;}
.loader-bar-fill{height:100%;background:linear-gradient(90deg,var(--teal2),var(--sky));animation:loadFill 1.2s ease forwards;width:0%;}

@keyframes loadFill{to{width:100%;}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.1);opacity:0.8;}}

/* NAVBAR STYLE */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 5%;height:76px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);box-shadow:0 1px 0 var(--border),0 4px 24px rgba(11,31,58,0.04);}
.nav-brand{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo-svg{width:34px;height:34px;fill:var(--teal);}
.nav-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--navy);letter-spacing:0.5px;}
.nav-name span{color:var(--teal);}
.nav-links{display:flex;gap:32px;list-style:none;}
.nav-links a{color:var(--gray);text-decoration:none;font-size:14px;font-weight:500;position:relative;transition:color 0.3s;letter-spacing:0.3px;}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:var(--teal);transition:width 0.3s ease;}
.nav-links a:hover{color:var(--navy);}
.nav-links a:hover::after{width:100%;}
.nav-cta{background:linear-gradient(135deg,var(--teal),var(--sky));color:white;padding:10px 24px;border-radius:30px;font-size:14px;font-weight:600;text-decoration:none;transition:all 0.3s;box-shadow:0 4px 16px rgba(0,137,123,0.2);}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,137,123,0.3);}

/* HERO SECTION */
.hero{min-height:100vh;background:linear-gradient(135deg,var(--navy) 0%,#0D2B4E 50%,#0F3460 100%);display:grid;grid-template-columns:1.2fr 0.8fr;align-items:center;padding:120px 5% 60px;position:relative;overflow:hidden;gap:40px;}
.hero-grid-pattern{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.01) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;}
.hero-content{position:relative;z-index:2;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(0,191,165,0.1);border:1px solid rgba(0,191,165,0.2);color:var(--teal2);font-size:12px;font-weight:600;letter-spacing:1px;padding:6px 16px;border-radius:30px;margin-bottom:24px;}
.badge-dot{width:6px;height:6px;background:var(--teal2);border-radius:50%;}
.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(38px,5vw,64px);font-weight:700;color:white;line-height:1.1;margin-bottom:20px;}
.hero h1 span{background:linear-gradient(135deg,var(--teal2),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{font-size:16px;color:rgba(255,255,255,0.65);max-width:480px;font-weight:300;margin-bottom:36px;}

/* HERO CTAs */
.hero-btns{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:40px;}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:white;padding:14px 32px;border-radius:30px;font-size:15px;font-weight:600;text-decoration:none;transition:all 0.3s;box-shadow:0 6px 24px rgba(0,137,123,0.3);}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,137,123,0.4);}
.btn-emergency{background:var(--red);color:white;padding:14px 32px;border-radius:30px;font-size:15px;font-weight:600;text-decoration:none;transition:all 0.3s;box-shadow:0 6px 24px rgba(211,47,47,0.3);}
.btn-emergency:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(211,47,47,0.4);background:#b71c1c;}

/* HERO STATS */
.hero-stats{display:flex;gap:0;padding-top:30px;border-top:1px solid rgba(255,255,255,0.08);}
.hstat{padding-right:36px;margin-right:36px;border-right:1px solid rgba(255,255,255,0.08);}
.hstat:last-child{border:none;padding:0;margin:0;}
.hstat-num{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;color:var(--white);line-height:1;}
.hstat-label{font-size:11px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;margin-top:6px;}

/* HERO IMAGE TRUSt PLATFORM */
.hero-image-container{position:relative;z-index:2;display:flex;justify-content:center;}
.hero-doctor-img{width:100%;max-width:420px;height:480px;object-fit:cover;border-radius:30px;box-shadow:var(--shadow2);border:1px solid rgba(255,255,255,0.1);background:#133357;}
.trust-badge-float{position:absolute;bottom:20px;left:-20px;background:var(--white);padding:14px 20px;border-radius:16px;box-shadow:var(--shadow2);display:flex;flex-direction:column;gap:4px;border:1px solid var(--lgray);}
.trust-title{font-size:12px;font-weight:600;color:var(--gray);text-transform:uppercase;letter-spacing:0.5px;}
.trust-certs{font-size:14px;font-weight:700;color:var(--navy);}

/* SERVICES SECTION */
.services-section{padding:100px 5%;background:var(--off);text-align:center;}
.section-header{max-width:600px;margin:0 auto 60px;}
.section-header h2{font-family:'Cormorant Garamond',serif;font-size:42px;color:var(--navy);margin-bottom:14px;font-weight:700;}
.section-header p{color:var(--gray);font-size:16px;}
.services-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:30px;max-width:1200px;margin:0 auto;}

.service-card {
  background: var(--white);
  border-radius: 20px;
  padding: 45px 35px;
  text-align: left;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.service-card:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow2);
  border-color: var(--teal);
}
.service-card.featured-card {
  background: linear-gradient(180deg, var(--white) 0%, var(--cream) 100%);
  border-top: 4px solid var(--teal);
}
.service-icon-wrapper{width:56px;height:56px;border-radius:12px;background:var(--off);display:flex;align-items:center;justify-content:center;margin-bottom:24px;color:var(--teal);transition:all 0.3s;}
.service-icon-wrapper svg{width:28px;height:28px;fill:currentColor;}
.service-card:hover .service-icon-wrapper{background:var(--teal);color:var(--white);}
.service-card h3 {font-family:'Cormorant Garamond',serif;font-size:24px;margin-bottom:12px;color:var(--navy);font-weight:700;}
.service-card p {color:var(--gray);font-size:14.5px;line-height:1.6;margin-bottom:24px;}
.service-link {font-size:14px;font-weight:600;color:var(--blue);text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
.service-link:hover {color:var(--teal);}

/* DOCTOR PROFILES SECTION */
.doctors-section{padding:100px 5%;background:var(--white);text-align:center;}
.doctors-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));gap:30px;max-width:1200px;margin:40px auto 0;}
.doc-card{background:var(--white);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--lgray);text-align:left;transition:transform 0.3s;}
.doc-card:hover{transform:translateY(-5px);}
.doc-img{width:100%;height:280px;object-fit:cover;background:var(--cream);}
.doc-info{padding:24px;}
.doc-info h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--navy);margin-bottom:4px;}
.doc-info p{font-size:13px;color:var(--teal);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;}
.doc-qual{font-size:14px;color:var(--gray);border-top:1px solid var(--lgray);padding-top:12px;}

/* CLINIC FEATURES (HOURS & MAP) */
.clinic-features-section {padding:80px 5%;background:var(--off);}
.features-container {max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1.2fr;gap:40px;align-items:center;}
.hours-card {background:var(--navy);color:var(--white);padding:40px;border-radius:24px;box-shadow:var(--shadow2);}
