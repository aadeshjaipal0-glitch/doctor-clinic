<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediCare Plus — Premium Healthcare & Dental Clinic</title>

<!-- Enhanced Technical SEO Meta Tags -->
<meta name="description" content="Welcome to MediCare Plus Clinic. Book online appointments with certified general physicians, cardiologists, and dental specialists. Trusted expert healthcare with 24/7 emergency support.">
<meta name="keywords" content="MediCare Plus, clinical appointment, certified doctors, dental care, cardiology consulting, premium medical center">
<meta name="robots" content="index, follow">

<link href="https://googleapis.com" rel="stylesheet">
<style>
:root {
  --navy:    #0B1F3A;
  --blue:    #1565C0;
  --sky:     #2196F3;
  --teal:    #00897B;
  --teal2:   #00BFA5;
  --white:   #FFFFFF;
  --off:     #F4F8FF;
  --cream:   #EEF4FF;
  --gray:    #607D8B;
  --lgray:   #ECEFF1;
  --border:  rgba(21,101,192,0.1);
  --gold:    #FFB300;
  --red:     #D32F2F;
  --shadow:  0 4px 24px rgba(11,31,58,0.06);
  --shadow2: 0 16px 48px rgba(11,31,58,0.12);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:'Outfit',sans-serif;background:var(--white);color:var(--navy);overflow-x:hidden;}

/* SCROLL PROGRESS BAR */
#progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--sky));z-index:9999;width:0%;transition:width 0.1s;}

/* PROFESSIONAL PRELOADER */
#loader{position:fixed;inset:0;background:var(--navy);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity 0.6s ease,transform 0.6s cubic-bezier(0.16,1,0.3,1);}
#loader.hide{opacity:0;transform:translateY(-30px);pointer-events:none;}
.loader-logo{width:60px;height:60px;fill:var(--teal2);animation:pulseAnimation 1.5s ease-in-out infinite;}
.loader-name{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:white;letter-spacing:2px;opacity:0;animation:fadeIn 0.5s 0.2s ease forwards;}
.loader-bar{width:160px;height:2px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden;opacity:0;animation:fadeIn 0.5s 0.4s ease forwards;}
.loader-bar-fill{height:100%;background:var(--teal2);animation:loadFill 1.2s 0.5s ease forwards;width:0%;}

@keyframes loadFill{to{width:100%;}}
@keyframes pulseAnimation{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.1);opacity:0.8;}}
@keyframes fadeIn{to{opacity:1;}}

/* NAVBAR WITH INTEGRATED SVG MEDICAL LOGO */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 5%;height:75px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.98);backdrop-filter:blur(20px);box-shadow:0 1px 0 var(--border),0 4px 24px rgba(11,31,58,0.04);}
.nav-brand{display:flex;align-items:center;gap:10px;}
.nav-logo-svg{width:36px;height:36px;fill:var(--teal);}
.nav-name{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--navy);letter-spacing:0.5px;}
.nav-name span{color:var(--teal);font-weight:400;}
.nav-links{display:flex;gap:36px;list-style:none;}
.nav-links a{color:var(--gray);text-decoration:none;font-size:14px;font-weight:500;position:relative;transition:color 0.3s;letter-spacing:0.3px;}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:2px;background:var(--teal);transition:width 0.3s;}
.nav-links a:hover{color:var(--navy);}
.nav-links a:hover::after{width:100%;}
.nav-cta{background:linear-gradient(135deg,var(--teal),var(--sky));color:white;padding:11px 26px;border-radius:30px;font-size:14px;font-weight:600;text-decoration:none;transition:all 0.3s;box-shadow:0 4px 16px rgba(0,137,123,0.2);letter-spacing:0.3px;}
.nav-cta:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,137,123,0.3);}

/* HERO SECTION UPGRADED WITH TRUST PSYCHOLOGY */
.hero{min-height:100vh;background:linear-gradient(135deg,#07162c 0%,#0F3460 100%);display:grid;grid-template-columns:1.2fr 0.8fr;align-items:center;padding:120px 5% 60px;position:relative;overflow:hidden;gap:50px;}
.hero-grid-pattern{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.01) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;}
.hero-content{position:relative;z-index:2;}
.hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(0,191,165,0.08);border:1px solid rgba(0,191,165,0.2);color:var(--teal2);font-size:12px;font-weight:600;letter-spacing:1px;padding:6px 16px;border-radius:30px;margin-bottom:24px;text-transform:uppercase;}
.badge-verified-icon{width:14px;height:14px;fill:var(--teal2);}

.hero h1{font-family:'Cormorant Garamond',serif;font-size:clamp(38px,5vw,64px);font-weight:700;color:white;line-height:1.1;margin-bottom:20px;}
.hero h1 span.gradient-text {background: linear-gradient(135deg,var(--teal2),var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero-sub{font-size:16px;color:rgba(255,255,255,0.65);line-height:1.7;max-width:500px;font-weight:300;margin-bottom:36px;}

/* CLEAR VISIBLE CALL TO ACTIONS */
.hero-btns{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:32px;}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal2));color:white;padding:14px 32px;border-radius:30px;font-size:15px;font-weight:600;text-decoration:none;transition:all 0.3s;box-shadow:0 6px 20px rgba(0,137,123,0.3);display:inline-flex;align-items:center;gap:10px;}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,137,123,0.45);}
.btn-emergency{background:var(--red);color:white;padding:14px 32px;border-radius:30px;font-size:15px;font-weight:600;text-decoration:none;transition:all 0.3s;box-shadow:0 6px 20px rgba(211,47,47,0.3);display:inline-flex;align-items:center;gap:10px;}
.btn-emergency:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(211,47,47,0.45);background:#b71c1c;}
.btn-icon-svg{width:16px;height:16px;fill:currentColor;}

/* REAL CLINIC VISUAL ANCHOR (NO CARTOONS) */
.hero-image-container{position:relative;display:flex;justify-content:center;align-items:center;z-index:2;}
.doctor-profile-card{background:linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.08);padding:45px 35px;border-radius:28px;backdrop-filter:blur(15px);text-align:center;width:100%;max-width:420px;box-shadow:var(--shadow2);}
.profile-placeholder-graphic{width:90px;height:90px;background:rgba(255,255,255,0.05);border-radius:50%;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,0.1);}
.profile-svg{width:42px;height:42px;fill:rgba(255,255,255,0.7);}
.doctor-profile-card h3{color:var(--white);font-family:'Cormorant Garamond',serif;font-size:26px;margin-bottom:6px;font-weight:600;}
.doctor-profile-card p{color:var(--teal2);font-size:13px;text-transform:uppercase;letter-spacing:1px;font-weight:500;margin-bottom:16px;}
.clinic-badges-row{display:flex;justify-content:center;gap:12px;margin-top:20px;font-size:12px;color:rgba(255,255,255,0.5);font-weight:400;}
.clinic-badges-row span{background:rgba(255,255,255,0.04);padding:6px 14px;border-radius:30px;border:1px solid rgba(255,255,255,0.06);letter-spacing:0.5px;}

.hero-stats{display:flex;margin-top:40px;padding-top:35px;border-top:1px solid rgba(255,255,255,0.06);}
.hstat{padding-right:40px;margin-right:40px;border-right:1px solid rgba(255,255,255,0.06);}
.hstat:last-child{border:none;padding:0;margin:0;}
.hstat-num{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:700;color:var(--white);line-height:1;}
.hstat-label{font-size:11px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;margin-top:6px;}

/* SERVICES GRID WITH VARYING VISUAL WEIGHT */
.services-section{padding:100px 5%;background:var(--off);text-align:center;}
.section-header{max-width:600px;margin:0 auto 60px;}
.section-header h2{font-family:'Cormorant Garamond',serif;font-size:44px;color:var(--navy);margin-bottom:14px;font-weight:700;}
.section-header p{color:var(--gray);font-size:16px;line-height:1.6;font-weight:400;}
.services-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));gap:30px;max-width:1200px;margin:0 auto;}

.service-card {
  background: var(--white);
  border-radius: 24px;
  padding: 45px 35px;
  text-align: left;
  transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow);
  border: 1px solid rgba(21,101,192,0.04);
  position: relative;
}
.service-card:hover {
  transform: translateY(-8px);
  box-shadow: var(--shadow2);
  border-color: rgba(0,137,123,0.2);
}
/* Alternating visual weight card layout */
.service-card.featured-card {
  background: linear-gradient(180deg, var(--white) 0%, #f0f6ff 100%);
  border-top: 4px solid var(--blue);
}
.card-icon-box {
  width: 54px;
  height: 54px;
  border-radius: 14px;
  background: var(--off);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
  color: var(--teal);
  transition: all 0.3s;
}
.vector-icon-svg{width:24px;height:24px;fill:currentColor;}
.service-card:hover .card-icon-box {
  background: var(--teal);
  color: var(--white);
}
.service-card.featured-card:hover .card-icon-box {
  background: var(--blue);
}
.service-card h3 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 25px;
  margin-bottom: 12px;
  color: var(--navy);
  font-weight: 700;
}
.service-card p {
  color: var(--gray);
  font-size: 14.5px;
  line-height: 1.6;
  margin-bottom: 24px;
}
.service-link {
  font-size: 14px;
  font-weight: 600;
  color: var(--blue);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color 0.3s;
}
.service-link:hover {
